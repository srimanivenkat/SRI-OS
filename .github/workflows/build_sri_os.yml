name: Build SRI OS (Android 17) for POCO X4 Pro 5G

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'What to build?'
        required: true
        default: 'bootimage'
        type: choice
        options:
          - bootimage
          - vendorbootimage
          - bacon (Full ROM)

env:
  MANIFEST_URL: "https://github.com/PixelOS-AOSP/manifest.git"
  BRANCH: "fourteen"
  DEVICE: "veux"

jobs:
  build:
    name: Build SRI OS
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout SRI OS Blueprints
      uses: actions/checkout@v4
      
    - name: Maximize Cloud Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        swap-size-mb: 8192
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    - name: Initialize & Sync Android Source (Shallow)
      run: |
        mkdir workspace && cd workspace
        git config --global user.name "SRI Cloud Builder"
        git config --global user.email "cloud@srios.local"
        ~/bin/repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.BRANCH }} --depth=1
        
        # Inject our hardware device trees
        mkdir -p .repo/local_manifests
        cp ../local_manifests/veux.xml .repo/local_manifests/
        
        # Sync the source code
        ~/bin/repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

    - name: Inject Custom SRI Code (Spoofing & UI)
      run: |
        cd workspace
        # Copying our custom Kotlin and C++ files into the Android Source Tree
        cp -r ../custom_code/* frameworks/base/

    - name: Compile the OS
      run: |
        cd workspace
        source build/envsetup.sh
        lunch lineage_${{ env.DEVICE }}-userdebug
        mka ${{ github.event.inputs.build_target }}

    - name: Upload Finished Images for Download
      uses: actions/upload-artifact@v4
      with:
        name: SRI_OS_${{ github.event.inputs.build_target }}
        path: |
          workspace/out/target/product/${{ env.DEVICE }}/boot.img
          workspace/out/target/product/${{ env.DEVICE }}/vendor_boot.img
          workspace/out/target/product/${{ env.DEVICE }}/*-ota-*.zip
